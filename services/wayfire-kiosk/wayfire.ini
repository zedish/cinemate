[core]
plugins = autostart

[output:DPI-1]
transform = 270

[autostart]
chromium = chromium-browser --kiosk --no-sandbox --ozone-platform=wayland --disable-features=TranslateUI --disable-sync --disable-default-apps --disable-extensions --disable-background-networking --no-first-run --hide-scrollbars --autoplay-policy=no-user-gesture-required http://localhost:5000
